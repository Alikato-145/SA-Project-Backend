name: haris-payroll-backend

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-haris_payroll}
      MYSQL_USER: ${MYSQL_USER:-haris}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-haris_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - payroll_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  payroll_data:
